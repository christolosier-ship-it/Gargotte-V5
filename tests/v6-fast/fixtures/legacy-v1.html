<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Fixture IndexedDB V1</title></head>
<body>
  <main id="status">Préparation fixture V1…</main>
  <script>
    const DB_NAME = "gargottex-v5-offline";
    const req = indexedDB.open(DB_NAME, 1);

    req.onupgradeneeded = () => {
      const db = req.result;
      const defs = [
        ["meta", "key", []],
        ["dungeons", "id", ["slug", "name"]],
        ["creatures", "id", ["slug", "name", "dungeon_id", "category"]],
        ["heroes", "id", ["hero_base_name", "level", "name"]],
        ["npcs", "id", ["slug", "name"]],
        ["quests", "id", ["slug", "name", "dungeon_id", "npc_id"]],
        ["loot_items", "id", ["slug", "name", "creature_id"]],
        ["brouhaha_effects", "id", ["level", "dungeon_id"]],
        ["media_assets", "id", ["entity_type", "entity_id", "path"]],
        ["logs", "id", ["created_at", "level"]]
      ];
      for (const [name, keyPath, indexes] of defs) {
        const store = db.createObjectStore(name, { keyPath });
        for (const index of indexes) store.createIndex(index, index, { unique: false });
      }
    };

    req.onerror = () => {
      document.body.dataset.ready = "error";
      document.querySelector("#status").textContent = String(req.error || "Erreur IndexedDB");
    };

    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction(Array.from(db.objectStoreNames), "readwrite");
      const now = new Date().toISOString();

      tx.objectStore("meta").put({ key: "ui_state", value: null });
      tx.objectStore("meta").put({ key: "app_version", value: "5.0.0" });

      tx.objectStore("dungeons").put({
        id: "legacy-dungeon-1",
        slug: "donjon-legacy",
        name: "Donjon Legacy",
        description: "Donnée créée avant V6",
        floor_budgets: [3,5,7,9,11],
        boss_name: "",
        tags: ["legacy"],
        image_path: "",
        unknown_legacy_field: "KEEP-DUNGEON",
        created_at: now
      });

      tx.objectStore("creatures").put({
        id: "legacy-creature-1",
        slug: "gobelin-legacy",
        name: "Gobelin Legacy",
        dungeon_id: "legacy-dungeon-1",
        dungeon_name: "Donjon Legacy",
        dungeon_slug: "donjon-legacy",
        category: "tactique",
        menace: 2,
        pv: 7,
        atk: 3,
        def: 1,
        zone: 1,
        actions: 2,
        special_attack_name: "Clé à molette orbitale",
        ai_behavior: "Reste pénible avec méthode.",
        lore: "Lore historique. ".repeat(30),
        socle: "32mm",
        tags: ["legacy","test"],
        image_path: "",
        unknown_legacy_field: { preserve: true, value: 42 },
        created_at: now
      });

      tx.objectStore("creatures").put({
        id: "legacy-orphan-1",
        slug: "orphelin",
        name: "Créature avec relation manquante et un nom beaucoup trop long pour vérifier le reflow sans casser la mise en page",
        dungeon_id: "missing-dungeon",
        dungeon_name: "Donjon disparu",
        category: "basique",
        menace: 1,
        pv: 1,
        atk: 1,
        def: 0,
        zone: 1,
        actions: 2,
        lore: "",
        tags: [],
        created_at: now
      });

      tx.objectStore("heroes").put({
        id: "legacy-hero-1",
        hero_base_name: "Brünhilda",
        level: 1,
        name: "Brünhilda la Torgnole",
        role: "Tank",
        pv: 10, atk: 3, def: 4, zone: 1, actions: 3,
        ability_text: "Tenir bon",
        effect_text: "Reste debout.",
        brouhaha: 0,
        tags: [],
        image_path: "",
        created_at: now
      });

      tx.objectStore("npcs").put({
        id: "legacy-npc-1",
        slug: "berthold",
        name: "Berthold Legacy",
        race: "Humain",
        role: "Tavernier",
        tone: "Sec",
        lore: "Ancien PNJ",
        tags: [],
        image_path: "",
        created_at: now
      });

      tx.objectStore("quests").put({
        id: "legacy-quest-1",
        slug: "quete-legacy",
        name: "Quête Legacy",
        description: "Description",
        objective: "Ramener quelque chose.",
        reward: "Niveau",
        difficulty: 2,
        npc_id: "legacy-npc-1",
        npc_name: "Berthold Legacy",
        dungeon_id: "legacy-dungeon-1",
        dungeon_name: "Donjon Legacy",
        tags: [],
        image_path: "",
        created_at: now
      });

      tx.objectStore("loot_items").put({
        id: "legacy-loot-1",
        slug: "boulon",
        creature_id: "legacy-creature-1",
        creature_name: "Gobelin Legacy",
        name: "Boulon historique",
        type: "Commun",
        effect: "Aucun",
        gold_value: 1,
        tags: [],
        image_path: "",
        created_at: now
      });

      tx.objectStore("brouhaha_effects").put({
        id: "legacy-bh-1",
        level: 3,
        dungeon_id: "legacy-dungeon-1",
        dungeon_name: "Donjon Legacy",
        effect_text: "Une table glisse.",
        created_at: now
      });

      const originalBytes = new Uint8Array([137,80,78,71,13,10,26,10,1,2,3,4,5,6,7,8]);
      const thumbBytes = new Uint8Array([82,73,70,70,1,2,3,4]);
      tx.objectStore("media_assets").put({
        id: "legacy-media-1",
        label: "Original historique",
        file_name: "legacy.png",
        path: "legacy.png",
        thumb_path: "legacy-thumb.webp",
        mime_type: "image/png",
        entity_type: "creatures",
        entity_id: "legacy-creature-1",
        width: 100,
        height: 200,
        blob: new Blob([originalBytes], { type: "image/png" }),
        thumb_blob: new Blob([thumbBytes], { type: "image/webp" }),
        unknown_media_field: "KEEP-MEDIA",
        created_at: now
      });

      tx.oncomplete = () => {
        db.close();
        document.body.dataset.ready = "true";
        document.querySelector("#status").textContent = "Fixture V1 prête";
      };
      tx.onerror = () => {
        document.body.dataset.ready = "error";
        document.querySelector("#status").textContent = String(tx.error || "Erreur transaction");
      };
    };
  </script>
</body>
</html>
