name: Mockup cutout engine benchmark

on:
  push:
    branches: [V5.3]
    paths:
      - '.github/workflows/mockup-cutout-benchmark.yml'

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout V5.3
        uses: actions/checkout@v4
        with:
          ref: V5.3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark engines
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "rembg[cpu,cli]" pillow
          python -m pip install --disable-pip-version-check transparent-background
          python -m pip install --disable-pip-version-check git+https://github.com/PramaLLC/BEN2.git

      - name: Run IS-Net, InSPyReNet and BEN2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gargotte-cutout-benchmark
          mkdir -p /tmp/gargotte-cutout-benchmark/{isnet,inspyrenet,ben2}

          # Three deliberately difficult figurines: dark/partially lost bases.
          rembg i -m isnet-general-use assets/images/berthold.png /tmp/gargotte-cutout-benchmark/isnet/berthold.png
          rembg i -m isnet-general-use assets/images/demon.png /tmp/gargotte-cutout-benchmark/isnet/demon.png
          rembg i -m isnet-general-use assets/images/bard.png /tmp/gargotte-cutout-benchmark/isnet/bard.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from transparent_background import Remover

          sources = {
              'berthold': Path('assets/images/berthold.png'),
              'demon': Path('assets/images/demon.png'),
              'bard': Path('assets/images/bard.png'),
          }
          out_dir = Path('/tmp/gargotte-cutout-benchmark/inspyrenet')
          remover = Remover(mode='base', device='cpu', resize='dynamic')
          for key, src in sources.items():
              image = Image.open(src).convert('RGB')
              out = remover.process(image, type='rgba')
              out.save(out_dir / f'{key}.png')
              print('InSPyReNet:', key, out.size)
          PY

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import torch
          from ben2 import AutoModel

          sources = {
              'berthold': Path('assets/images/berthold.png'),
              'demon': Path('assets/images/demon.png'),
              'bard': Path('assets/images/bard.png'),
          }
          out_dir = Path('/tmp/gargotte-cutout-benchmark/ben2')
          device = torch.device('cpu')
          model = AutoModel.from_pretrained('PramaLLC/BEN2')
          model.to(device).eval()
          for key, src in sources.items():
              image = Image.open(src).convert('RGB')
              out = model.inference(image)
              out.save(out_dir / f'{key}.png')
              print('BEN2:', key, out.size)
          PY

      - name: Normalize outputs and build dark-background comparison sheet
        shell: bash
        run: |
          set -euo pipefail
          rm -rf docs/mockup-assets/cutout-benchmark
          mkdir -p docs/mockup-assets/cutout-benchmark/{isnet,inspyrenet,ben2}

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          root = Path('/tmp/gargotte-cutout-benchmark')
          dest = Path('docs/mockup-assets/cutout-benchmark')
          current = Path('docs/mockup-assets/creatures-transparent')
          ids = ['berthold', 'demon', 'bard']
          row_names = {
              'berthold': 'Videur du Cellier',
              'demon': 'Démon de la Réserve',
              'bard': 'Maître du Comptoir',
          }
          engines = [
              ('current', 'BiRefNet + ViTMatte'),
              ('isnet', 'IS-Net / DIS'),
              ('inspyrenet', 'InSPyReNet'),
              ('ben2', 'BEN2 Base'),
          ]

          def crop_alpha(im, threshold=4, pad_ratio=0.045):
              im = im.convert('RGBA')
              alpha = im.getchannel('A')
              mask = alpha.point(lambda a: 255 if a > threshold else 0)
              bbox = mask.getbbox()
              if not bbox:
                  return im
              x0, y0, x1, y1 = bbox
              w, h = x1 - x0, y1 - y0
              pad = max(12, round(max(w, h) * pad_ratio))
              return im.crop((
                  max(0, x0 - pad), max(0, y0 - pad),
                  min(im.width, x1 + pad), min(im.height, y1 + pad)
              ))

          # Save normalized candidates for later zoom/testing.
          normalized = {}
          for engine, _label in engines:
              normalized[engine] = {}
              for creature_id in ids:
                  src = current / f'{creature_id}.png' if engine == 'current' else root / engine / f'{creature_id}.png'
                  with Image.open(src) as im:
                      out = crop_alpha(im)
                      normalized[engine][creature_id] = out.copy()
                      if engine != 'current':
                          out.save(dest / engine / f'{creature_id}.png', 'PNG', optimize=True)
                      print(engine, creature_id, out.size, out.getchannel('A').getextrema())

          cell_w, cell_h = 610, 720
          header_h, label_h = 90, 54
          canvas_w = cell_w * len(engines)
          canvas_h = header_h + (cell_h + label_h) * len(ids)
          bg = (11, 8, 6)
          panel = (18, 13, 9)
          border = (75, 56, 40)
          text = (244, 232, 216)
          muted = (183, 161, 135)
          canvas = Image.new('RGB', (canvas_w, canvas_h), bg)
          draw = ImageDraw.Draw(canvas)
          font = ImageFont.load_default(size=24)
          font_small = ImageFont.load_default(size=18)

          for col, (_engine, label) in enumerate(engines):
              x0 = col * cell_w
              draw.rectangle((x0, 0, x0 + cell_w - 1, header_h - 1), fill=panel, outline=border, width=2)
              draw.text((x0 + 24, 28), label, fill=text, font=font)

          for row, creature_id in enumerate(ids):
              y0 = header_h + row * (cell_h + label_h)
              draw.rectangle((0, y0, canvas_w - 1, y0 + label_h - 1), fill=(23, 17, 13), outline=border, width=1)
              draw.text((20, y0 + 14), row_names[creature_id], fill=muted, font=font_small)
              cell_y = y0 + label_h
              for col, (engine, _label) in enumerate(engines):
                  x0 = col * cell_w
                  draw.rectangle((x0, cell_y, x0 + cell_w - 1, cell_y + cell_h - 1), fill=bg, outline=border, width=2)
                  cut = normalized[engine][creature_id]
                  max_w, max_h = cell_w - 80, cell_h - 70
                  ratio = min(max_w / cut.width, max_h / cut.height)
                  size = (max(1, round(cut.width * ratio)), max(1, round(cut.height * ratio)))
                  cut = cut.resize(size, Image.Resampling.LANCZOS)
                  px = x0 + (cell_w - cut.width) // 2
                  py = cell_y + (cell_h - cut.height) // 2
                  canvas.paste(cut.convert('RGB'), (px, py), cut.getchannel('A'))

          canvas.save(dest / 'comparison.jpg', 'JPEG', quality=94, optimize=True)
          PY

      - name: Commit benchmark results and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mockup-assets/cutout-benchmark
          git rm .github/workflows/mockup-cutout-benchmark.yml
          git commit -m "docs(mockup): compare alternative cutout engines"
          git push origin HEAD:V5.3
