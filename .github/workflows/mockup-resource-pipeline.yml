name: Mockup resource pipeline

on:
  push:
    branches: [V5.3]
    paths:
      - ".github/workflows/mockup-resource-pipeline.yml"
      - "scripts/mockup/process_mockup_resources.py"
      - "docs/mockup-assets/creatures/**"
      - "docs/mockup-assets/heros/**"
      - "docs/mockup-assets/stat-export/**"

permissions:
  contents: write

concurrency:
  group: mockup-resource-pipeline-v53
  cancel-in-progress: true

jobs:
  cutout-and-extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout V5.3
        uses: actions/checkout@v4
        with:
          ref: V5.3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image pipeline
        run: python -m pip install --upgrade pip pillow rembg onnxruntime

      - name: Run documented cutout workflow and extract selection data
        run: python scripts/mockup/process_mockup_resources.py

      - name: Commit generated mockup assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mockup-assets/creatures-transparent docs/mockup-assets/heros-transparent docs/mockup-assets/generated-data
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore(mockup): generate transparent test assets"
            git push origin HEAD:V5.3
          fi
