name: Mockup tiers and Codex browser smoke

on:
  push:
    branches: [V5.3]
    paths:
      - '.github/workflows/mockup-tier-smoke.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V5.3
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve mockup
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/mockup-http.log 2>&1 &
          sleep 2

      - name: Exercise validated Codex and new tier systems
        run: |
          cat > .tmp-tier-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));

          await page.goto('http://127.0.0.1:8000/docs/GARGOTTEX-V6-MAQUETTE-PREMIUM-V3.html#codex',{waitUntil:'networkidle'});
          await page.waitForTimeout(400);

          const report={families:{},pageErrors};

          const families=['creatures','dungeons','heroes','npcs','quests','loot','interactables','brouhaha'];
          for(const family of families){
            const tab=page.locator('.codex-tabs button[data-codex="'+family+'"]');
            await tab.click();
            await page.waitForTimeout(90);
            report.families[family]={
              active:await page.locator('#codex-'+family+'.active').count(),
              cards:family==='creatures'
                ? await page.locator('#bestiary-collection [data-creature]').count()
                : await page.locator('#'+family+'-browser [data-family-item]').count(),
              detail:family==='creatures'
                ? await page.locator('#creature-detail .sheet').count()
                : await page.locator('#'+family+'-browser .family-detail-card').count()
            };
          }

          await page.locator('.codex-tabs button[data-codex="quests"]').click();
          await page.waitForTimeout(100);
          report.questLegend=await page.locator('#quests-browser .tier-legend .tier-badge').allTextContents();
          report.questCardBadges=await page.locator('#quests-browser [data-family-item] .tier-badge').count();
          report.questDetailBadge=await page.locator('#quests-browser .family-detail-card .tier-badge').first().textContent();
          report.questPaper=await page.locator('#quests-browser .quest-contract').evaluate(el=>getComputedStyle(el).backgroundImage);

          await page.locator('.codex-tabs button[data-codex="loot"]').click();
          await page.waitForTimeout(100);
          report.lootLegend=await page.locator('#loot-browser .tier-legend .tier-badge').allTextContents();
          report.lootCardBadges=await page.locator('#loot-browser [data-family-item] .tier-badge').count();
          report.lootDetailBadge=await page.locator('#loot-browser .family-detail-card .tier-badge').first().textContent();

          await page.locator('.codex-tabs button[data-codex="npcs"]').click();
          await page.waitForTimeout(100);
          report.npcPaper=await page.locator('#npcs-browser .npc-lore').evaluate(el=>getComputedStyle(el).backgroundImage);

          await page.locator('.codex-tabs button[data-codex="creatures"]').click();
          await page.waitForTimeout(100);
          report.creaturePaper=await page.locator('#creature-detail .lore').evaluate(el=>getComputedStyle(el).backgroundImage);

          console.log('TIER_SMOKE_REPORT_START');
          console.log(JSON.stringify(report,null,2));
          console.log('TIER_SMOKE_REPORT_END');

          const expectedQuests=['Très facile','Facile','Normale','Difficile','Très difficile','Extrême'];
          const expectedLoot=['Mauvais','Commun','Inhabituel','Rare','Épique','Légendaire'];
          const hasAll=(actual,expected)=>expected.every(x=>actual.some(v=>v.includes(x)));
          const parchment=x=>String(x).includes('paper-aged-light.svg');
          const bad=
            pageErrors.length>0 ||
            report.families.creatures.cards!==6 ||
            report.families.quests.cards!==6 ||
            report.families.loot.cards!==6 ||
            Object.values(report.families).some(x=>x.active!==1||x.cards<1||x.detail!==1) ||
            report.questCardBadges!==6 || report.lootCardBadges!==6 ||
            !hasAll(report.questLegend,expectedQuests) || !hasAll(report.lootLegend,expectedLoot) ||
            !parchment(report.questPaper) || !parchment(report.npcPaper) || !parchment(report.creaturePaper);

          await browser.close();
          if(bad)process.exit(1);
          JS
          node .tmp-tier-smoke.mjs
          rm -f .tmp-tier-smoke.mjs

      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .tmp-tier-smoke.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mockup-tier-smoke.yml
          git commit -m "chore(mockup): remove tier browser smoke workflow"
          git push origin HEAD:V5.3
