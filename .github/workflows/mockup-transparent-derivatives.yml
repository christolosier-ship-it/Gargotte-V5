name: Mockup transparent creature derivatives

on:
  push:
    branches:
      - V5.3
    paths:
      - .github/workflows/mockup-transparent-derivatives.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5.3
        uses: actions/checkout@v4
        with:
          ref: V5.3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow numpy scipy

      - name: Generate static transparent display derivatives
        shell: python
        run: |
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageOps
          from scipy import ndimage

          ROOT = Path('.')
          OUT = ROOT / 'docs' / 'mockup-assets' / 'creatures-transparent'
          OUT.mkdir(parents=True, exist_ok=True)

          creatures = {
              'rainette': ROOT / 'assets' / 'images' / 'rainette.jpeg',
              'trixie': ROOT / 'assets' / 'images' / 'trixie.jpeg',
              'berthold': ROOT / 'assets' / 'images' / 'berthold.png',
              'bard': ROOT / 'assets' / 'images' / 'bard.png',
              'demon': ROOT / 'assets' / 'images' / 'demon.png',
              'gundrade': ROOT / 'assets' / 'images' / 'gundrade.jpeg',
          }

          def resize_for_display(im, max_dim=1600):
              w, h = im.size
              scale = min(1.0, max_dim / max(w, h))
              if scale < 1.0:
                  im = im.resize((max(1, round(w * scale)), max(1, round(h * scale))), Image.Resampling.LANCZOS)
              return im

          def border_pixels(rgb):
              top = rgb[0, :, :]
              bottom = rgb[-1, :, :]
              left = rgb[:, 0, :]
              right = rgb[:, -1, :]
              return np.concatenate([top, bottom, left, right], axis=0)

          def transparent_derivative(path, dest):
              with Image.open(path) as source:
                  im = ImageOps.exif_transpose(source).convert('RGBA')
              im = resize_for_display(im)
              arr = np.array(im, dtype=np.uint8)
              rgb = arr[:, :, :3].astype(np.int16)
              border = border_pixels(rgb)
              bg = np.median(border, axis=0)
              bg_span = float(bg.max() - bg.min())
              white_like = float(bg.min()) >= 218 and bg_span <= 30

              if white_like:
                  diff = rgb - bg.reshape((1, 1, 3))
                  dist = np.sqrt(np.sum(diff * diff, axis=2, dtype=np.int32))
                  candidate = dist <= 58
                  seed = np.zeros(candidate.shape, dtype=bool)
                  seed[0, :] = candidate[0, :]
                  seed[-1, :] = candidate[-1, :]
                  seed[:, 0] |= candidate[:, 0]
                  seed[:, -1] |= candidate[:, -1]
                  background = ndimage.binary_propagation(seed, mask=candidate)

                  alpha = arr[:, :, 3].astype(np.float32)
                  soft = np.clip((dist.astype(np.float32) - 10.0) / 42.0, 0.0, 1.0) * 255.0
                  alpha[background] = np.minimum(alpha[background], soft[background])
                  arr[:, :, 3] = alpha.astype(np.uint8)

                  # Crop the now-transparent outer canvas so the figurine occupies the stage.
                  visible = arr[:, :, 3] > 18
                  ys, xs = np.where(visible)
                  if len(xs) and len(ys):
                      x0, x1 = int(xs.min()), int(xs.max()) + 1
                      y0, y1 = int(ys.min()), int(ys.max()) + 1
                      pad = max(12, round(max(x1 - x0, y1 - y0) * 0.045))
                      x0, y0 = max(0, x0 - pad), max(0, y0 - pad)
                      x1, y1 = min(arr.shape[1], x1 + pad), min(arr.shape[0], y1 + pad)
                      arr = arr[y0:y1, x0:x1]

              out = Image.fromarray(arr, 'RGBA')
              out.save(dest, format='PNG', optimize=True)
              print(f'{path} -> {dest} | bg={bg.tolist()} | transparent={white_like} | size={out.size}')

          for creature_id, source in creatures.items():
              transparent_derivative(source, OUT / f'{creature_id}.png')

          js_path = ROOT / 'docs' / 'mockup-assets' / 'maquette-v3.js'
          js = js_path.read_text(encoding='utf-8')
          source_names = {
              'rainette': 'rainette.jpeg',
              'trixie': 'trixie.jpeg',
              'berthold': 'berthold.png',
              'bard': 'bard.png',
              'demon': 'demon.png',
              'gundrade': 'gundrade.jpeg',
          }
          for creature_id, source_name in source_names.items():
              old = f"img:'../assets/images/{source_name}'"
              new = old + f",displayImg:'./mockup-assets/creatures-transparent/{creature_id}.png'"
              if new in js:
                  continue
              if old not in js:
                  raise SystemExit(f'Pattern not found for {creature_id}: {old}')
              js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')

      - name: Commit generated derivatives and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mockup-assets/creatures-transparent docs/mockup-assets/maquette-v3.js
          git rm .github/workflows/mockup-transparent-derivatives.yml
          git commit -m "docs(mockup): use static transparent creature derivatives"
          git push origin HEAD:V5.3
