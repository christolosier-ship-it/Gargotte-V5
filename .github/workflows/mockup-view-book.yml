name: Build Gargottex view book

on:
  push:
    branches: [V5.3]
    paths:
      - "scripts/mockup/build_view_book.py"
      - ".github/workflows/mockup-view-book.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gargottex-view-book-v53
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout V5.3
        uses: actions/checkout@v4
        with:
          ref: V5.3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install document and browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow reportlab playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Build cahier des vues
        run: python scripts/mockup/build_view_book.py

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CAHIER-DES-VUES-GARGOTTEX-V6.pdf
          if git diff --cached --quiet; then
            echo "No PDF change."
          else
            git commit -m "docs(mockup): generate Gargottex view book"
            git push origin HEAD:V5.3
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: gargottex-view-book
          path: docs/CAHIER-DES-VUES-GARGOTTEX-V6.pdf
          if-no-files-found: error
          retention-days: 14
