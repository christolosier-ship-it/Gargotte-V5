name: V6-Fast CI

on:
  pull_request:
    branches: [V5.3]
  workflow_dispatch:

concurrency:
  group: v6fast-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Fast / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run V6-Fast
        run: npm run test:v6fast:fast

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v6fast-fast-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
