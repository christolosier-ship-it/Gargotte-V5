name: UI-6 final validation

on:
  pull_request:
    branches: [V5.3]
  push:
    branches: [ui6-polish-validation-v6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright + axe + IndexedDB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run UI-6
        run: npm run test:ui6

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui6-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
