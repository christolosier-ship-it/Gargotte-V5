name: UI-6 final validation

on:
  pull_request:
    branches: [V5.3]
  push:
    branches: [ui6-polish-validation-v6]
  workflow_dispatch:

concurrency:
  group: ui6-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright + axe + IndexedDB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run UI-6 diagnostic
        run: >
          npx playwright test
          tests/ui6/indexeddb.spec.mjs
          tests/ui6/ui6.spec.mjs
          tests/ui6/visual.spec.mjs
          --grep "IndexedDB|old incomplete|polished home|Codex polish|detail polish|responsive matrix covers|Media library|existing approved|rembg retirement cleanup|Service Worker cache|mobile WebKit|V3 visual comparison pack"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui6-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
