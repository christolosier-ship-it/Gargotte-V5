name: Mockup BiRefNet tuned cutouts

on:
  push:
    branches: [V5.3]
    paths:
      - '.github/workflows/mockup-birefnet-tuned-test.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout V5.3
        uses: actions/checkout@v4
        with:
          ref: V5.3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install BiRefNet tooling
        run: python -m pip install --disable-pip-version-check "rembg[cpu]" pillow

      - name: Generate tuned BiRefNet transparent derivatives
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageOps
          from rembg import remove, new_session

          root = Path('.')
          out_dir = root / 'docs' / 'mockup-assets' / 'creatures-transparent'
          out_dir.mkdir(parents=True, exist_ok=True)

          sources = {
              'rainette': root / 'assets' / 'images' / 'rainette.jpeg',
              'trixie': root / 'assets' / 'images' / 'trixie.jpeg',
              'berthold': root / 'assets' / 'images' / 'berthold.png',
              'bard': root / 'assets' / 'images' / 'bard.png',
              'demon': root / 'assets' / 'images' / 'demon.png',
              'gundrade': root / 'assets' / 'images' / 'gundrade.jpeg',
          }

          session = new_session('birefnet-general')

          def crop_alpha(im: Image.Image, threshold=8, pad_ratio=0.045):
              im = im.convert('RGBA')
              alpha = im.getchannel('A')
              mask = alpha.point(lambda a: 255 if a > threshold else 0)
              bbox = mask.getbbox()
              if not bbox:
                  return im
              x0, y0, x1, y1 = bbox
              w, h = x1 - x0, y1 - y0
              pad = max(12, round(max(w, h) * pad_ratio))
              x0 = max(0, x0 - pad)
              y0 = max(0, y0 - pad)
              x1 = min(im.width, x1 + pad)
              y1 = min(im.height, y1 + pad)
              return im.crop((x0, y0, x1, y1))

          for creature_id, source in sources.items():
              with Image.open(source) as original:
                  oriented = ImageOps.exif_transpose(original).convert('RGBA')
                  max_dim = 1800
                  scale = min(1.0, max_dim / max(oriented.size))
                  if scale < 1.0:
                      oriented = oriented.resize(
                          (max(1, round(oriented.width * scale)), max(1, round(oriented.height * scale))),
                          Image.Resampling.LANCZOS,
                      )
                  buf = BytesIO()
                  oriented.save(buf, format='PNG')

              cutout_bytes = remove(
                  buf.getvalue(),
                  session=session,
                  alpha_matting=True,
                  alpha_matting_foreground_threshold=215,
                  alpha_matting_background_threshold=5,
                  alpha_matting_erode_size=2,
                  post_process_mask=False,
              )
              cutout = Image.open(BytesIO(cutout_bytes)).convert('RGBA')
              cutout = crop_alpha(cutout)
              dest = out_dir / f'{creature_id}.png'
              cutout.save(dest, format='PNG', optimize=True)
              alpha = cutout.getchannel('A')
              print(f'{creature_id}: size={cutout.size} alpha={alpha.getextrema()}')
          PY

      - name: Commit tuned derivatives and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mockup-assets/creatures-transparent
          git rm .github/workflows/mockup-birefnet-tuned-test.yml
          git commit -m "docs(mockup): tune BiRefNet matting for creature bases"
          git push origin HEAD:V5.3
