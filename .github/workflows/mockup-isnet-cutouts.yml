name: Mockup IS-Net creature cutouts

on:
  push:
    branches: [V5.3]
    paths:
      - '.github/workflows/mockup-isnet-cutouts.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout V5.3
        uses: actions/checkout@v4
        with:
          ref: V5.3
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install IS-Net pipeline
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check "rembg[cpu,cli]" pillow

      - name: Regenerate six transparent mockup creatures with IS-Net
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gargotte-isnet
          mkdir -p /tmp/gargotte-isnet

          rembg i -m isnet-general-use assets/images/bard.png /tmp/gargotte-isnet/bard.png
          rembg i -m isnet-general-use assets/images/berthold.png /tmp/gargotte-isnet/berthold.png
          rembg i -m isnet-general-use assets/images/demon.png /tmp/gargotte-isnet/demon.png
          rembg i -m isnet-general-use assets/images/gundrade.jpeg /tmp/gargotte-isnet/gundrade.png
          rembg i -m isnet-general-use assets/images/rainette.jpeg /tmp/gargotte-isnet/rainette.png
          rembg i -m isnet-general-use assets/images/trixie.jpeg /tmp/gargotte-isnet/trixie.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src_dir = Path('/tmp/gargotte-isnet')
          dst_dir = Path('docs/mockup-assets/creatures-transparent')
          ids = ['bard', 'berthold', 'demon', 'gundrade', 'rainette', 'trixie']

          def crop_alpha(im, threshold=4, pad_ratio=0.045):
              im = im.convert('RGBA')
              alpha = im.getchannel('A')
              mask = alpha.point(lambda a: 255 if a > threshold else 0)
              bbox = mask.getbbox()
              if not bbox:
                  return im
              x0, y0, x1, y1 = bbox
              w, h = x1 - x0, y1 - y0
              pad = max(12, round(max(w, h) * pad_ratio))
              return im.crop((
                  max(0, x0 - pad), max(0, y0 - pad),
                  min(im.width, x1 + pad), min(im.height, y1 + pad)
              ))

          for creature_id in ids:
              with Image.open(src_dir / f'{creature_id}.png') as im:
                  out = crop_alpha(im)
                  out.save(dst_dir / f'{creature_id}.png', 'PNG', optimize=True)
                  print(creature_id, out.size, out.getchannel('A').getextrema())
          PY

      - name: Commit IS-Net derivatives and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mockup-assets/creatures-transparent
          git rm .github/workflows/mockup-isnet-cutouts.yml
          git commit -m "docs(mockup): switch creature cutouts to IS-Net"
          git push origin HEAD:V5.3
