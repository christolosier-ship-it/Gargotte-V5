<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <filter id="paperNoise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.085" numOctaves="3" seed="37" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        0.34 0 0 0 0.48
        0 0.28 0 0 0.40
        0 0 0.18 0 0.28
        0 0 0 .18 0" result="fibers"/>
      <feBlend in="SourceGraphic" in2="fibers" mode="multiply"/>
    </filter>
    <radialGradient id="stainA" cx="0.22" cy="0.30" r="0.18">
      <stop offset="0" stop-color="#8d673b" stop-opacity=".13"/>
      <stop offset=".42" stop-color="#a67b4b" stop-opacity=".06"/>
      <stop offset="1" stop-color="#a67b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stainB" cx="0.78" cy="0.70" r="0.22">
      <stop offset="0" stop-color="#76512f" stop-opacity=".09"/>
      <stop offset=".52" stop-color="#997044" stop-opacity=".04"/>
      <stop offset="1" stop-color="#997044" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeAge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7e5" stop-opacity=".42"/>
      <stop offset=".48" stop-color="#ead9b8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#9a7045" stop-opacity=".16"/>
    </linearGradient>
  </defs>
  <rect width="640" height="640" fill="#eadcbc"/>
  <rect x="6" y="6" width="628" height="628" rx="7" fill="#efe3c9" filter="url(#paperNoise)"/>
  <rect width="640" height="640" fill="url(#stainA)"/>
  <rect width="640" height="640" fill="url(#stainB)"/>
  <rect width="640" height="640" fill="url(#edgeAge)"/>
  <g fill="#6f4d2f" opacity=".055">
    <circle cx="92" cy="506" r="8"/><circle cx="105" cy="520" r="3.5"/><circle cx="533" cy="122" r="5"/>
    <circle cx="506" cy="146" r="2.5"/><ellipse cx="404" cy="558" rx="13" ry="5"/>
  </g>
</svg>